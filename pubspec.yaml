name: food_ui_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/image/
    
  fonts:
    - family: Sen
      fonts:
        - asset: lib/assets/fonts/Sen-Regular.ttf
        - asset: lib/assets/fonts/Sen-ExtraBold.ttf
          weight: 800